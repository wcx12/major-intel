[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "major-intel"
version = "0.1.0"
description = "Local SQL-first retrieval and function-call tooling for college major intelligence."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
